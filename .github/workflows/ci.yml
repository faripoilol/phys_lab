name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile track_marker_cam.py extract_frequencies_prony.py
      - run: pytest -q

  estimator:
    name: Browser estimator (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/estimator.test.js

  site:
    name: Static site build and headless UI test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: ./scripts/build-static-site.sh
      - run: python -m pytest -q tests/test_ui_live_lab.py
